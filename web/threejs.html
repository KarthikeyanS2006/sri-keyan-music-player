<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0,viewport-fit=cover" name="viewport"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Three.js Visualizer - Obsidian Sound</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
</style>
</head>
<body>
<div id="threejs-root" style="width:100%;height:100%;display:block;"></div>
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<script>
(function() {
  var container = document.getElementById('threejs-root');
  var width = container.clientWidth || window.innerWidth;
  var height = container.clientHeight || window.innerHeight;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);

  var geometry = new THREE.IcosahedronGeometry(1.5, 2);
  var material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
  var sphere = new THREE.Mesh(geometry, material);
  scene.add(sphere);

  var coreGeom = new THREE.IcosahedronGeometry(0.8, 1);
  var coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
  var core = new THREE.Mesh(coreGeom, coreMat);
  scene.add(core);

  camera.position.z = 4;

  var animId = null;

  function animate() {
    animId = requestAnimationFrame(animate);
    var time = Date.now() * 0.001;
    sphere.rotation.y += 0.005;
    sphere.rotation.z += 0.002;
    var scale = 1.0 + Math.sin(time * 4.0) * 0.1;
    sphere.scale.set(scale, scale, scale);
    core.rotation.y -= 0.01;
    var coreScale = 1.0 + Math.cos(time * 4.0) * 0.05;
    core.scale.set(coreScale, coreScale, coreScale);
    renderer.render(scene, camera);
  }

  function onResize() {
    var w = container.clientWidth || window.innerWidth;
    var h = container.clientHeight || window.innerHeight;
    if (w === 0 || h === 0) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  window.addEventListener('resize', onResize, false);

  var ro = null;
  if (typeof ResizeObserver !== 'undefined') {
    ro = new ResizeObserver(onResize);
    ro.observe(container);
  }

  animate();
})();
</script>
</body>
</html>
