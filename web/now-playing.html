<!-- Atmospheric Shader Background -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute inset-0 bg-background mix-blend-multiply z-10"></div>
<div class="w-full h-full opacity-60" style="display:block;">
<canvas id="shader-canvas-np-bg" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-np-bg');
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;
void main() {
    vec2 uv = v_texCoord;
    float time = u_time * 0.5;
    float n = 0.0;
    vec2 p = uv * 3.0;
    for(float i = 1.0; i < 4.0; i++) {
        p += vec2(sin(p.y + time + i), cos(p.x + time - i));
        n += 1.0 / i * abs(sin(p.x + p.y));
    }
    vec3 colorA = vec3(0.05, 0.05, 0.05);
    vec3 colorB = vec3(0.3, 0.3, 0.3);
    vec3 colorC = vec3(0.8, 0.8, 0.8);
    vec3 finalColor = mix(colorA, colorB, n * 0.5);
    finalColor = mix(finalColor, colorC, pow(n, 4.0) * 0.1);
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-anim10" style="width:100%;height:100%"></div>
<script>
(function() {
  var container = document.getElementById('threejs-container-anim10');
  var width = container.clientWidth || window.innerWidth;
  var height = container.clientHeight || window.innerHeight;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(width, height);
  container.appendChild(renderer.domElement);
  var geometry = new THREE.IcosahedronGeometry(1.5, 2);
  var material = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
  var sphere = new THREE.Mesh(geometry, material);
  scene.add(sphere);
  var coreGeom = new THREE.IcosahedronGeometry(0.8, 1);
  var coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
  var core = new THREE.Mesh(coreGeom, coreMat);
  scene.add(core);
  camera.position.z = 4;
  function animate() {
    requestAnimationFrame(animate);
    var time = Date.now() * 0.001;
    sphere.rotation.y += 0.005;
    sphere.rotation.z += 0.002;
    var scale = 1.0 + Math.sin(time * 4.0) * 0.1;
    sphere.scale.set(scale, scale, scale);
    core.rotation.y -= 0.01;
    var coreScale = 1.0 + Math.cos(time * 4.0) * 0.05;
    core.scale.set(coreScale, coreScale, coreScale);
    renderer.render(scene, camera);
  }
  function onResize() {
    var w = container.clientWidth || window.innerWidth;
    var h = container.clientHeight || window.innerHeight;
    if (w === 0 || h === 0) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize, false);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(onResize).observe(container);
  }
  animate();
})();
</script>
