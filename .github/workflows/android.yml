name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Get APK info
        id: apk-info
        run: |
          SIZE=$(stat --printf="%s" build/app/outputs/flutter-apk/app-release.apk)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "size=${SIZE_MB} MB" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: keyan-music-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "latest" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_SIZE="${{ steps.apk-info.outputs.size }}"
          NOTES="Keyan Music - Latest Build\n\nBuild Date: ${BUILD_DATE}\nCommit: ${SHORT_SHA}\nAPK Size: ${APK_SIZE}\n\nDownload app-release.apk below and enable Install from unknown sources."
          gh release create "latest" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Keyan Music ${BUILD_DATE}" \
            --notes "$(echo -e "${NOTES}")" \
            --latest

      - name: Update README
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_SIZE="${{ steps.apk-info.outputs.size }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/latest"
          WORKFLOW_URL="https://github.com/${REPO}/actions/workflows/android.yml"

          python3 -c "
          import re, sys
          with open('README.md', 'r') as f:
              content = f.read()
          section = '### Android APK\n\n'
          section += '[![APK Build](' + '${WORKFLOW_URL}' + '/badge.svg)](' + '${WORKFLOW_URL}' + ')\n\n'
          section += '| | |\n'
          section += '|---|---|\n'
          section += '| **Download APK** | **[app-release.apk](' + '${RELEASE_URL}' + ')** |\n'
          section += '| **Size** | ' + '${APK_SIZE}' + ' |\n'
          section += '| **Built** | ' + '${BUILD_DATE}' + ' |\n'
          section += '| **Commit** | [' + '${SHORT_SHA}' + '](https://github.com/${REPO}/commit/' + '${GITHUB_SHA}' + ') |\n\n'
          section += '#### How to Install\n'
          section += '1. Click **[Download APK](' + '${RELEASE_URL}' + ')** above\n'
          section += '2. Click **app-release.apk** to download\n'
          section += '3. Open the APK and enable Install from unknown sources\n'
          section += '4. Install and enjoy!\n\n'
          section += '> Always gets the latest build - link auto-updates on every push.\n\n'
          pattern = r'### Android APK\n\n.*?(?=### Live Web App)'
          updated = re.sub(pattern, section, content, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(updated)
          print('README updated')
          "

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update README with latest APK release link [skip ci]"
          git push
